[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-hook-guard"
version = "0.1.0"
description = "Static analyzer that flags WordPress plugin/theme entry points missing authorization or nonce guards (broken access control, CSRF, privilege escalation)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jakub Kozub" }]
keywords = [
    "wordpress", "security", "static-analysis", "sast", "access-control",
    "csrf", "nonce", "bug-bounty", "appsec", "vulnerability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jakubkozub/wp-hook-guard"
Issues = "https://github.com/jakubkozub/wp-hook-guard/issues"

[project.scripts]
wp-hook-guard = "wp_hook_guard.cli:main"

[tool.setuptools]
packages = ["wp_hook_guard"]
